name: nixpkgs maintained packages
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
concurrency:
  group: nixpkgs-maintained
  cancel-in-progress: false
permissions: {}
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install brotli
        run: sudo apt-get update -q && sudo apt-get install -y -q brotli
      - name: Update README
        # githubId of maintainers.gaupee in nixpkgs maintainer-list.nix
        run: ./scripts/nixpkgs-maintained.sh 54892453 README.md
      - name: Commit and push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add README.md
          if git commit -m "chore: update nixpkgs maintained packages"; then
            git push
          fi
